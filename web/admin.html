<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dips++ Map Moderation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.css" />
  <style>
    :root {
      --bg: #0e0e0e;
      --panel: #161616;
      --fg: #e8e8e8;
      --muted: #8b8b8b;
      --line: #1a1a1a;
      --edge: #2c2c2c;
      --warn: #b89a5a;
      --err: #b86a6a;
      --ok: #6f9a72;
      --accent: #7a8f9e;
      --accent-2: #8a7e92;
      --accent-3: #9a8568;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.55;
      background: var(--bg);
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .wrap {
      max-width: 740px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 {
      font-size: 14px;
      font-weight: 500;
      margin: 0 0 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    h2 {
      font-size: 11px;
      font-weight: 500;
      margin: 0 0 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .sub { color: var(--muted); margin: 0 0 2rem; }
    header {
      margin-bottom: 1.1rem;
      padding: 1rem 1.1rem;
      background: var(--panel);
      border: 2px solid var(--edge);
      box-shadow: 4px 4px 0 var(--accent);
    }
    section {
      background: var(--panel);
      border: 2px solid var(--edge);
      padding: 1.2rem 1.25rem 1.5rem;
      margin: 0 0 1.35rem;
      box-shadow: 4px 4px 0 var(--accent-2);
      overflow: visible;
    }
    #map-card { box-shadow: 4px 4px 0 var(--accent-3); }
    #ban-card { box-shadow: 4px 4px 0 var(--err); }
    #delegate-card { box-shadow: 4px 4px 0 var(--ok); }
    label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 0.85rem 0 0.4rem;
    }
    input, textarea {
      font: inherit;
      color: var(--fg);
      background: #101010;
      border: 2px solid var(--edge);
      border-radius: 0;
      padding: 0.55rem 0.65rem;
      width: 100%;
      outline: none;
      box-shadow: 3px 3px 0 var(--accent);
      color-scheme: dark;
    }
    input:focus, textarea:focus {
      border-color: #555;
      box-shadow: 3px 3px 0 var(--warn);
    }
    textarea { min-height: 4.5rem; resize: vertical; }
    button, .act {
      font: inherit;
      color: var(--fg);
      background: #101010;
      border: 2px solid var(--edge);
      border-radius: 0;
      padding: 0.45rem 0.75rem;
      margin: 0.85rem 0.55rem 0 0;
      cursor: pointer;
      width: auto;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 11px;
      box-shadow: 3px 3px 0 var(--accent-2);
      flex: 0 0 auto;
    }
    button:hover, .act:hover {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 var(--accent-2);
      border-color: #444;
    }
    button:active, .act:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--accent-2);
    }
    button:focus-visible, .act:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 1px solid var(--warn);
      outline-offset: 2px;
    }
    button.danger {
      box-shadow: 3px 3px 0 var(--err);
    }
    button.danger:hover { box-shadow: 2px 2px 0 var(--err); }
    button.danger:active { box-shadow: 0 0 0 var(--err); }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end; }
    .row > *:not(button) { flex: 1 1 200px; min-width: 0; }
    .row.actions { align-items: center; }
    .field { min-width: 0; }
    .tag {
      display: inline;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .tag::before { content: "["; }
    .tag::after { content: "]"; }
    .tag.ok { color: var(--ok); }
    .tag.warn { color: var(--warn); }
    .entry {
      border: 2px solid var(--edge);
      padding: 0.85rem 0.9rem;
      margin: 0 0 1rem;
      background: #101010;
      box-shadow: 3px 3px 0 var(--accent-2);
    }
    .entry-grid {
      display: grid;
      grid-template-columns: 5.75rem minmax(0, 1fr);
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .entry-grid .k {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-top: 0.1rem;
    }
    .entry-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 0.7rem;
      margin-top: 0.85rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--edge);
    }
    .entry-actions button { margin: 0; }
    .expires-lines { display: flex; flex-direction: column; gap: 0.15rem; }
    table { width: 100%; border-collapse: collapse; margin: 0.5rem 0 1rem; }
    th, td {
      text-align: left;
      padding: 0.55rem 0.4rem 0.55rem 0;
      border-bottom: 1px solid var(--edge);
      vertical-align: top;
      font-weight: 400;
    }
    th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    code {
      font: inherit;
      color: var(--muted);
      overflow-wrap: anywhere;
      word-break: normal;
    }
    code.wsid { font-size: 12px; }
    a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    .err { color: var(--err); white-space: pre-wrap; margin: 0.5rem 0 0; }
    .okmsg { color: var(--ok); margin: 0.5rem 0 0; }
    .hidden { display: none !important; }
    .meta { margin: 1rem 0 0; color: var(--muted); }
    .identity { margin: 0 0 0.75rem; }
    @media (prefers-reduced-motion: reduce) {
      button:hover, .act:hover, button:active, .act:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Dips++ Map Moderation</h1>
      <p class="sub">Map Ban · Delegates · Trackmania OAuth</p>
    </header>

    <section id="auth-card">
      <div id="logged-out">
        <p class="sub" style="margin-bottom:0.75rem">Sign in with Trackmania to moderate Maps you author, or as Super-mod / Delegate.</p>
        <button type="button" onclick="location.href='/api/mod/oauth/start'">Login with Trackmania</button>
      </div>
      <div id="logged-in" class="hidden">
        <p class="identity">
          Signed in as <strong id="me-name"></strong>
          <span class="tag" id="me-role"></span>
        </p>
        <code id="me-wsid"></code>
        <div class="row actions">
          <button type="button" onclick="logout()">Logout</button>
        </div>
      </div>
    </section>

    <section id="map-card">
      <h2>Open Map</h2>
      <label for="map-uid">Map UID</label>
      <form id="map-form" class="row" onsubmit="event.preventDefault(); loadMap();">
        <div class="field">
          <input id="map-uid" list="map-uid-history" placeholder="27-char map UID" autocomplete="on" />
          <datalist id="map-uid-history"></datalist>
        </div>
        <button type="submit">Load</button>
      </form>
      <p id="map-info" class="meta"></p>
      <p id="map-err" class="err"></p>
    </section>

    <section class="hidden" id="ban-card">
      <h2>Map Bans</h2>
      <div id="ban-list"></div>
      <h2 style="margin-top:1.75rem">Apply Map Ban</h2>
      <div class="row">
        <div class="field">
          <label for="ban-name">Display name</label>
          <input id="ban-name" placeholder="player name" autocomplete="off" />
        </div>
        <div class="field">
          <label for="ban-wsid">or WSID</label>
          <input id="ban-wsid" placeholder="uuid" autocomplete="off" />
        </div>
      </div>
      <label for="ban-private">Private reason (mods only)</label>
      <textarea id="ban-private"></textarea>
      <label for="ban-public">Public message (shown to player)</label>
      <textarea id="ban-public"></textarea>
      <label for="ban-expires">Expires at <span class="sub" style="margin:0;text-transform:none;letter-spacing:0">(optional · <span id="ban-expires-tz">local time</span>)</span></label>
      <input id="ban-expires" type="datetime-local" />
      <p class="sub" style="margin:0.4rem 0 0;font-size:11px">Interpreted in your browser timezone; stored and enforced as UTC.</p>
      <button type="button" class="danger" onclick="createBan()">Ban from this Map's LB</button>
      <p id="ban-msg"></p>
    </section>

    <section class="hidden" id="delegate-card">
      <h2>Map Delegates</h2>
      <div id="delegate-list"></div>
      <div class="row" style="margin-top:1rem">
        <div class="field">
          <label for="del-name">Display name</label>
          <input id="del-name" autocomplete="off" />
        </div>
        <div class="field">
          <label for="del-wsid">or WSID</label>
          <input id="del-wsid" autocomplete="off" />
        </div>
      </div>
      <button type="button" onclick="addDelegate()">Add Delegate</button>
      <p id="del-msg"></p>
    </section>
  </div>

  <script>
    let me = null;
    let currentUid = null;
    let canModerate = false;
    let canManageDelegates = false;

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
      });
      const text = await res.text();
      let data = null;
      try { data = JSON.parse(text); } catch (_) { data = { raw: text }; }
      if (!res.ok) throw new Error(data.error || text || res.statusText);
      return data;
    }

    async function refreshMe() {
      try {
        me = await api('/api/mod/me');
        document.getElementById('logged-out').classList.add('hidden');
        document.getElementById('logged-in').classList.remove('hidden');
        document.getElementById('me-name').textContent = me.display_name;
        document.getElementById('me-wsid').textContent = me.wsid;
        document.getElementById('me-role').textContent = me.is_super_mod ? 'Super-mod' : 'Player';
        document.getElementById('me-role').className = 'tag' + (me.is_super_mod ? ' ok' : '');
      } catch (_) {
        me = null;
        document.getElementById('logged-out').classList.remove('hidden');
        document.getElementById('logged-in').classList.add('hidden');
      }
    }

    async function logout() {
      await api('/api/mod/logout', { method: 'POST', body: '{}' });
      location.reload();
    }

    const MAP_UID_HISTORY_KEY = 'dd2_mod_map_uid_history';
    const MAP_UID_HISTORY_MAX = 30;

    function readMapUidHistory() {
      try {
        const raw = localStorage.getItem(MAP_UID_HISTORY_KEY);
        const list = raw ? JSON.parse(raw) : [];
        return Array.isArray(list) ? list.filter(u => typeof u === 'string' && u.trim()) : [];
      } catch (_) {
        return [];
      }
    }

    function writeMapUidHistory(uids) {
      localStorage.setItem(MAP_UID_HISTORY_KEY, JSON.stringify(uids.slice(0, MAP_UID_HISTORY_MAX)));
    }

    function rememberMapUid(uid) {
      const next = [uid, ...readMapUidHistory().filter(u => u !== uid)];
      writeMapUidHistory(next);
      renderMapUidHistory();
    }

    function renderMapUidHistory() {
      const dl = document.getElementById('map-uid-history');
      const uids = readMapUidHistory();
      dl.innerHTML = uids.map(u => `<option value="${escapeHtml(u)}"></option>`).join('');
      const input = document.getElementById('map-uid');
      if (!input.value && uids[0]) input.value = uids[0];
    }

    async function loadMap() {
      const uid = document.getElementById('map-uid').value.trim();
      document.getElementById('map-err').textContent = '';
      document.getElementById('map-info').textContent = '';
      if (!uid) return;
      try {
        const data = await api('/api/mod/map/' + encodeURIComponent(uid));
        currentUid = uid;
        rememberMapUid(uid);
        canModerate = data.can_moderate;
        canManageDelegates = data.is_author || data.is_super_mod;
        const m = data.meta;
        document.getElementById('map-info').innerHTML =
          `<span class="tag">${escapeHtml(m.map_name || 'unnamed')}</span>` +
          ` author <code>${m.author_id}</code>` +
          (data.is_author ? ' <span class="tag ok">Map Author</span>' : '') +
          (data.is_delegate ? ' <span class="tag ok">Delegate</span>' : '') +
          (data.can_moderate ? '' : ' <span class="tag warn">No mod rights</span>');
        document.getElementById('ban-card').classList.toggle('hidden', !canModerate);
        document.getElementById('delegate-card').classList.toggle('hidden', !canModerate);
        if (canModerate) {
          await refreshBans();
          await refreshDelegates();
        }
      } catch (e) {
        document.getElementById('map-err').textContent = e.message;
        document.getElementById('ban-card').classList.add('hidden');
        document.getElementById('delegate-card').classList.add('hidden');
      }
    }

    async function refreshBans() {
      const bans = await api('/api/mod/map/' + encodeURIComponent(currentUid) + '/bans');
      const el = document.getElementById('ban-list');
      if (!bans.length) { el.innerHTML = '<p class="sub">No active Map Bans.</p>'; return; }
      el.innerHTML = bans.map(b => `<div class="entry">
        <div class="entry-grid">
          <div class="k">User</div><div><code class="wsid">${b.user_id}</code></div>
          <div class="k">Public</div><div>${escapeHtml(b.public_message)}</div>
          <div class="k">Private</div><div>${escapeHtml(b.private_reason)}</div>
          <div class="k">Expires</div><div class="expires-lines">${formatExpires(b.expires_at)}</div>
        </div>
        <div class="entry-actions">
          <button type="button" onclick="liftBan('${b.user_id}', true)">Unban · keep unofficial</button>
          <button type="button" onclick="liftBan('${b.user_id}', false)">Unban · clear unofficial</button>
        </div>
      </div>`).join('');
    }

    async function createBan() {
      const msg = document.getElementById('ban-msg');
      msg.textContent = '';
      msg.className = '';
      try {
        const expiresRaw = document.getElementById('ban-expires').value.trim();
        let expires_at = null;
        if (expiresRaw) {
          const d = new Date(expiresRaw);
          if (Number.isNaN(d.getTime())) throw new Error('invalid expires_at');
          expires_at = d.toISOString();
        }
        const body = {
          display_name: document.getElementById('ban-name').value.trim() || null,
          user_id: document.getElementById('ban-wsid').value.trim() || null,
          private_reason: document.getElementById('ban-private').value,
          public_message: document.getElementById('ban-public').value,
          expires_at,
        };
        await api('/api/mod/map/' + encodeURIComponent(currentUid) + '/bans', {
          method: 'POST', body: JSON.stringify(body),
        });
        msg.textContent = 'Map Ban applied.';
        msg.className = 'okmsg';
        await refreshBans();
      } catch (e) {
        msg.textContent = e.message;
        msg.className = 'err';
      }
    }

    async function liftBan(userId, keep) {
      await api('/api/mod/map/' + encodeURIComponent(currentUid) + '/bans/' + userId + '/lift', {
        method: 'POST', body: JSON.stringify({ keep_unofficial: keep }),
      });
      await refreshBans();
    }

    async function refreshDelegates() {
      const dels = await api('/api/mod/map/' + encodeURIComponent(currentUid) + '/delegates');
      const el = document.getElementById('delegate-list');
      if (!dels.length) { el.innerHTML = '<p class="sub">No Delegates.</p>'; return; }
      el.innerHTML = dels.map(d => `<div class="entry">
        <div class="entry-grid">
          <div class="k">Name</div><div>${escapeHtml(d.display_name || '')}</div>
          <div class="k">WSID</div><div><code class="wsid">${d.user_id}</code></div>
        </div>
        ${canManageDelegates ? `<div class="entry-actions">
          <button type="button" class="danger" onclick="removeDelegate('${d.user_id}')">Remove</button>
        </div>` : ''}
      </div>`).join('');
    }

    async function addDelegate() {
      const msg = document.getElementById('del-msg');
      msg.textContent = '';
      try {
        await api('/api/mod/map/' + encodeURIComponent(currentUid) + '/delegates', {
          method: 'POST',
          body: JSON.stringify({
            display_name: document.getElementById('del-name').value.trim() || null,
            user_id: document.getElementById('del-wsid').value.trim() || null,
          }),
        });
        msg.textContent = 'Delegate added.';
        msg.className = 'okmsg';
        await refreshDelegates();
      } catch (e) {
        msg.textContent = e.message;
        msg.className = 'err';
      }
    }

    async function removeDelegate(userId) {
      await api('/api/mod/map/' + encodeURIComponent(currentUid) + '/delegates/' + userId, { method: 'DELETE' });
      await refreshDelegates();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function localTzLabel() {
      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'local';
        const parts = new Intl.DateTimeFormat('en-AU', { timeZoneName: 'short' }).formatToParts(new Date());
        const short = parts.find(p => p.type === 'timeZoneName')?.value || '';
        return short ? `${tz} · ${short}` : tz;
      } catch (_) {
        return 'local time';
      }
    }

    function formatExpires(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return escapeHtml(String(iso));
      const local = d.toLocaleString('en-AU', {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit', timeZoneName: 'short',
      });
      const utc = d.toISOString().replace('T', ' ').replace(/\.\d{3}Z$/, ' UTC');
      return `<span>${escapeHtml(local)}</span><span>${escapeHtml(utc)}</span>`;
    }

    document.getElementById('ban-expires-tz').textContent = localTzLabel();
    renderMapUidHistory();
    refreshMe();
  </script>
</body>
</html>
